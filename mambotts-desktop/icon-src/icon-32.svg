<!-- MamboTTS mark, 32 px tier (29-40 px): taskbar, Alt-Tab, Explorer details view.
     Tested at 1:1: a stroked "MT" needs ~1.2 px strokes here and renders as a
     grey smudge, so the letters are dropped and the record earns its identity
     from the label plus the spindle hole instead. No rays, grooves, tonearm or
     accent dots either - every remaining edge is >= 2 px. -->
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="16" r="15.2" fill="#FFD23F"/>
  <circle cx="16" cy="16" r="12" fill="#33270F"/>
  <circle cx="16" cy="16" r="5.6" fill="#FFF4DC"/>
  <circle cx="16" cy="16" r="1.4" fill="#33270F"/>
</svg>
