<!-- MamboTTS mark, 256 px tier (200 px and up): the full brand art - rays,
     grooves, highlight, tonearm and the teal/orange accent dots.
     Same drawing as app-icon.svg, with two Windows-minded differences:
     the macOS-style full-bleed rounded square is replaced by a circular badge
     on transparency, and the "MT" is drawn as strokes instead of live text so
     the render does not depend on which fonts a machine happens to have. -->
<svg width="256" height="256" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
  <circle cx="140" cy="140" r="133" fill="#FFD23F"/>
  <circle cx="140" cy="140" r="131.4" fill="none" stroke="#E0A81E" stroke-width="3.2"/>
  <g transform="translate(140,140)">
    <g fill="#2B1F0E" opacity="0.85">
      <path d="M0 -102 L8 -78 L-8 -78 Z"/>
      <path d="M97 -32 L74 -22 L79 -38 Z"/>
      <path d="M97 32 L79 38 L74 22 Z"/>
      <path d="M0 102 L-8 78 L8 78 Z"/>
      <path d="M-97 32 L-74 22 L-79 38 Z"/>
      <path d="M-97 -32 L-79 -38 L-74 -22 Z"/>
    </g>
    <g transform="rotate(-5)">
      <circle cx="4" cy="6" r="66" fill="#C79A10"/>
      <circle cx="0" cy="0" r="66" fill="#33270F" stroke="#F5F0E8" stroke-width="4"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#5C4A1F" stroke-width="2"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#5C4A1F" stroke-width="2"/>
      <path d="M-46 -33 A57 57 0 0 1 -10 -56" stroke="#F5F0E8" stroke-width="3" fill="none"
            stroke-linecap="round" opacity="0.8"/>
      <circle cx="0" cy="0" r="34" fill="#FFF4DC"/>
      <circle cx="0" cy="0" r="34" fill="none" stroke="#D8CFC0" stroke-width="2"/>
      <g transform="scale(2.6)" fill="none" stroke="#33270F" stroke-width="3.1"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M-10 6 V-6 L-5.5 0 L-1 -6 V6"/>
        <path d="M2 -6 H10"/>
        <path d="M6 -6 V6"/>
      </g>
    </g>
    <g transform="translate(72,-84)">
      <path d="M0 0 Q26 4 30 34" stroke="#2B1F0E" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="7" fill="#2B1F0E"/>
      <rect x="24" y="32" width="12" height="16" rx="3" fill="#2B1F0E" transform="rotate(18 30 40)"/>
    </g>
    <circle cx="-76" cy="56" r="4" fill="#FF6B35"/>
    <circle cx="-58" cy="-70" r="5" fill="#4ECDC4"/>
  </g>
</svg>
