<!-- MamboTTS mark, 128 px tier (81-199 px): Explorer large/extra-large icons,
     Windows Store logos, jump lists.
     The rays come back, plus two grooves and the label ring. The tonearm and
     the teal/orange accent dots are held back for the 256 px tier - at 128 px
     they sit on the badge rim and read as dirt. -->
