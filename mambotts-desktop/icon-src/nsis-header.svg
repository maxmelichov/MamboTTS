<!-- Source for src-tauri/installer/header.bmp - the 150x57 banner NSIS shows in
     the top-right of every wizard page. Exported as a 24-bit BMP at exactly
     150x57; NSIS will not accept any other size or depth. -->
<svg width="150" height="57" viewBox="0 0 150 57" xmlns="http://www.w3.org/2000/svg">
  <rect width="150" height="57" fill="#35220F"/>
  <rect y="54" width="150" height="3" fill="#FCD423"/>
  <g transform="translate(9,6.5) scale(0.0429688)">
  <rect width="1024" height="1024" rx="224" fill="#FCD423"/><path transform="translate(116.0,722.0) scale(0.6000,-0.6000)" d="M66 0V700H311L432 90H450L571 700H816V0H688V603H670L550 0H332L212 603H194V0Z" fill="#2E2300"/><path transform="translate(621.2,722.0) scale(0.6000,-0.6000)" d="M260 0Q211 0 180 30Q150 61 150 112V392H26V496H150V650H276V496H412V392H276V134Q276 104 304 104H400V0Z" fill="#2E2300"/>
  </g>
  <!-- 15/8 px, not 17/9: at 17 px "MamboTTS" runs past x=150 and the banner
       loses its last letter. Measured on the rendered BMP, not guessed. -->
  <text x="58" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="15"
        font-weight="700" fill="#FCD423">MamboTTS</text>
  <text x="58" y="41" font-family="Segoe UI, Arial, sans-serif" font-size="8"
        fill="#FAF3E6" opacity="0.72">Hebrew text to speech</text>
</svg>
