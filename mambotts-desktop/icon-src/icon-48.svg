  <g transform="translate(24,24) scale(0.58)" fill="none" stroke="#33270F"
     stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-10 6 V-6 L-5.5 0 L-1 -6 V6"/>
