  <circle cx="24" cy="24" r="22.8" fill="#FFD23F"/>
  <circle cx="24" cy="24" r="22" fill="none" stroke="#E0A81E" stroke-width="1.6"/>
  <circle cx="24" cy="24" r="16.6" fill="#33270F"/>
  <circle cx="24" cy="24" r="12.6" fill="none" stroke="#6B5622" stroke-width="1.6"/>
  <path d="M13.6 18.6 A11.8 11.8 0 0 1 20.4 13.2" fill="none" stroke="#FFF4DC"
        stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
