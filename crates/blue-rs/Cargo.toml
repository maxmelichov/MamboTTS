[package]
name = "blue-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# The GPU worker's wire format (ve_worker.rs): f32 tensors as bytes.
bytemuck = "1"
# The site front end's lookaround and backreference regexes, kept as written.
fancy-regex = "0.14"
# The vector estimator on the GPU (ve_gpu.rs): the BlueTTS site's Rust engine.
bluetts-engine = { path = "../bluetts-engine" }
# The Hebrew text normaliser of the BlueV3 release (he_normalize).
heb-tts-normalizer = "=0.2.0"
ndarray = "0.17"
# The release's G2P for English, German, Spanish, Italian and Russian, at the
# commit its training labels were made with (MANIFEST.json, polyg2p_commit).
polyg2p = { git = "https://github.com/maxmelichov/polyg2p", rev = "cbb613499adcda2d3039861c7d347c902e60fbd0" }
pollster = "0.4"
ort = { version = "=2.0.0-rc.11", features = ["ndarray"] }
rand = "0.9"
rand_distr = "0.5"
regex = "1"
renikud-plus-rs = { path = "../renikud-plus-rs" }
# float_roundtrip: numbers parse to the nearest double, as JavaScript and
# Python parse them (voice styles, speed_scale, the golden file).
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-normalization = "0.1"

[dev-dependencies]
sha2 = "0.10"
