[package]
name = "mamboblue-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mamboblue-server"
path = "src/main.rs"

[features]
default = []
# Compiles the Qwen3-TTS Hebrew runtime into the sidecar. Off by default
# because it builds qwentts.cpp and GGML from source, which is a long
# build and pulls native artifacts the Blue-only sidecar does not need.
qwen = ["dep:qwentts-rs"]
metal = ["qwentts-rs/metal"]
vulkan = ["qwentts-rs/vulkan"]
cuda = ["qwentts-rs/cuda"]

[dependencies]
anyhow = "1.0.100"
qwentts-rs = { path = "../crates/qwentts-rs", optional = true }
axum = "0.8.7"
blue-rs = { path = "../crates/blue-rs" }
mamboblue-registry = { path = "../crates/mamboblue-registry" }
futures-util = "0.3"
clap = { version = "4.5.53", features = ["derive"] }
hound = "3.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6.7", features = ["catch-panic"] }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
